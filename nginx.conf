# Escucha en 8081 y no en 80 porque Nginx Proxy Manager ya apunta a
# ticket-studio:8081 para ticket.danipoal.com (proxy_host/12.conf).
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La raiz es la landing publica (public/landing/index.html). La app sigue en /auth/*, /home, /tickets...;
    # un usuario con sesion llega a ella desde los botones de la landing ("Ir a mi panel").
    location = / {
        try_files /landing/index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Capturas de la landing: no cambian de nombre, cache de un mes
    location /landing/img/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Iconos de marca y manifest (raiz): cache de una semana (si se cambian, el navegador los refresca solo)
    location ~ ^/(favicon\.(svg|ico)|apple-touch-icon\.png|icon-[a-z0-9-]+\.png)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # nginx:alpine no conoce .webmanifest y lo serviria como application/octet-stream
    location = /site.webmanifest {
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # expo-router con output "static" genera /ruta.html, no /ruta/index.html,
    # asi que probamos ambas formas antes de caer al index.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # Los bundles llevan hash en el nombre: cache agresiva sin riesgo.
    location /_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/html application/javascript application/json application/xml image/svg+xml;
}
