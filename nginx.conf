# Escucha en 8081 y no en 80 porque Nginx Proxy Manager ya apunta a
# ticket-studio:8081 para ticket.danipoal.com (proxy_host/12.conf).
server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # expo-router con output "static" genera /ruta.html, no /ruta/index.html,
    # asi que probamos ambas formas antes de caer al index.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # Los bundles llevan hash en el nombre: cache agresiva sin riesgo.
    location /_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
