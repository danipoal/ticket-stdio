version: "3.9"

services:
  # Produccion: build estatico servido por nginx (~10 MB de RAM).
  # Para reconstruir tras cambiar el codigo:  docker compose up -d --build
  ticket-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: ticket-studio:prod
    container_name: ticket-studio
    restart: unless-stopped
    ports:
      - "19000:8081"
    networks:
      - reverse_proxy_network
    healthcheck:
      # 127.0.0.1 y no localhost: dentro del contenedor localhost resuelve
      # primero a ::1 y nginx solo escucha en IPv4, asi que daba "connection refused".
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Desarrollo bajo demanda: docker compose --profile dev up ticket-studio-dev
  # No arranca con "docker compose up" normal, asi que no consume RAM en reposo.
  ticket-studio-dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: ticket-studio-dev
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "19001:8081"
    networks:
      - reverse_proxy_network
    stdin_open: true
    tty: true

networks:
  reverse_proxy_network:
    external: true
